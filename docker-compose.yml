# Rotación de logs: sin esto Docker guarda todo lo que imprime cada contenedor
# en un archivo que crece para siempre (llena el disco y engorda a dockerd).
# Máximo 5 archivos de 10 MB por contenedor.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Núcleo: votos, asistencia, sockets, pleno, capturadora, SPID, eventos,
  # Presidencia — todo lo que es EN VIVO. Se queda con el nombre "backend"
  # para que `docker compose logs -f backend` siga funcionando igual.
  backend:
    build: ./backend
    # La imagen se construye UNA vez y la reutiliza backend-consultas.
    image: siregistroparlamentario-backend:latest
    env_file:
      - ./backend/.env
    environment:
      - ROLE=nucleo
    volumes:
      - ./backend/storage:/app/storage
    extra_hosts:
      # host.docker.internal solo resuelve solo en Docker Desktop (Mac/Windows) por
      # defecto; esto lo hace resolver también si la VM corre Docker en Linux.
      - "host.docker.internal:host-gateway"
    # Ya no publica el 3013: ahora lo publica el gateway (ver gateway.conf).
    # Usa ~100-200 MB: el tope solo frena una fuga de memoria, y sin swap para
    # que un voto nunca se alente por escribir a disco.
    mem_limit: 2g
    memswap_limit: 2g
    logging: *logging
    restart: unless-stopped

  # Consultas: reportes, estadísticas, inteligencia (CPU pesado). Mismo código,
  # otro proceso: si un reporte lo congela, el núcleo sigue respondiendo.
  backend-consultas:
    image: siregistroparlamentario-backend:latest
    pull_policy: never
    env_file:
      - ./backend/.env
    environment:
      - ROLE=consultas
      # Pool más chico: nunca puede acaparar las conexiones de la BD.
      - DB_POOL_MAX=10
      # Aquí el "modo sesión" va siempre activo (ver middlewares/modoSesion.ts):
      # a lo más 2 reportes armándose a la vez; las peticiones idénticas
      # comparten respuesta. Sin esto, armar todos a la vez agotó la memoria
      # de Node y reinició el contenedor (3 veces en la prueba de carga).
      - MODO_SESION_MAX_CONCURRENTES=2
      # No hay votos que proteger aquí: mejor esperar turno que dar 503.
      - MODO_SESION_ESPERA_MAX_MS=90000
      # Igual que la caché interna de los reportes (5 min).
      - MODO_SESION_CACHE_TTL_MS=300000
      - MODO_SESION_CACHE_MAX_MB=150
      # Memoria de Node explícita (antes la calculaba sola a partir del límite
      # del contenedor y quedó corta). Deja ~1 GB del contenedor para lo demás.
      - NODE_OPTIONS=--max-old-space-size=2048
    volumes:
      # Lectura/escritura: el PDF del orden del día (estadistico.ts) se genera
      # en storage/pdfs y el núcleo lo sirve en /storage (mismo volumen).
      - ./backend/storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Si un reporte se dispara de memoria, Docker reinicia SOLO este contenedor
    # en vez de que el sistema mate otro proceso al azar (p. ej. el núcleo).
    # El swap de la VM queda como red de seguridad, no para este contenedor.
    mem_limit: 3g
    memswap_limit: 3g
    depends_on:
      - backend
    logging: *logging
    restart: unless-stopped

  # Única entrada al backend en el 3013 de siempre (página pública,
  # SIPresidencia, capturadora... no cambian nada). Reparte por ruta.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3013:3013"
    depends_on:
      - backend
      - backend-consultas
    logging: *logging
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "8010:80"
    depends_on:
      - gateway
    logging: *logging
    restart: unless-stopped
