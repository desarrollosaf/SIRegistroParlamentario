# Gateway del backend (Fase 3 del plan de estabilidad).
#
# Es la ÚNICA entrada al backend: escucha en el 3013 de siempre, así que la
# página pública (PACongresoEdomex → http://192.168.36.61:3013), SIPresidencia,
# la capturadora, etc. no cambian nada. El nginx del front también entra aquí.
#
#   reportes / estadísticas / inteligencia / lista de iniciativas → backend-consultas
#   todo lo demás (votos, asistencia, sockets, pleno, eventos...)  → backend (núcleo)
#
# Si un reporte congela el CPU de "consultas", el núcleo sigue respondiendo.

# DNS interno de Docker + variables en proxy_pass: nginx vuelve a resolver los
# nombres cada 10s. Sin esto, al recrear un contenedor (docker compose up
# --build) cambia su IP y nginx seguiría mandando a la vieja → 502.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3013;
    server_name _;

    # Igual que pegarle directo a Express (sin límite práctico de nginx):
    # hay subidas de archivos (decretos, constancias, fotos).
    client_max_body_size 200m;

    # Los reportes pesados pueden tardar; el modo sesión responde 503 a los 20s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $nucleo    http://backend:3013;
    set $consultas http://backend-consultas:3013;

    # ── Consultas (CPU pesado) ───────────────────────────────────────────
    location /api/reporte/                { proxy_pass $consultas; }
    location /api/estadistico/            { proxy_pass $consultas; }
    location /api/inteligencia/           { proxy_pass $consultas; }
    location /api/iniciativas/iniciativas/ { proxy_pass $consultas; }

    # ── Socket.IO (núcleo) ───────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass $nucleo;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Todo lo demás (núcleo) ───────────────────────────────────────────
    location / {
        proxy_pass $nucleo;
    }
}
