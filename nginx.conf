server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para que la carga inicial del bundle de Angular sea más rápida en LAN.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API del backend (Express). Mismo origen que el front -> sin problemas de CORS.
    location /api/ {
        proxy_pass http://backend:3013/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos subidos (constancias, fotos, etc.) que el backend sirve como estáticos.
    location /storage/ {
        proxy_pass http://backend:3013/storage/;
        proxy_set_header Host $host;
    }

    # Socket.IO: requiere el upgrade de conexión para WebSocket.
    location /socket.io/ {
        proxy_pass http://backend:3013/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html.
    # Esto es lo que evita la pantalla en blanco al recargar una ruta profunda
    # (ej. /agenda/123) directamente en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre (chunk-XXXX.js) pueden cachearse agresivo;
    # index.html nunca, para que un nuevo despliegue se vea sin limpiar caché.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
